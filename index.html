}

async function downloadUpload(uploadId) {
  const name = DETAIL_FILES[uploadId] || "";
  const label = name || ("file_" + uploadId);
  const course = DETAIL_COURSE[uploadId] || "";
  // 统一走「后端直接写盘」通道：本地服务与浏览器同机，这样
  // 设置里的下载文件夹（含课程子文件夹）在浏览器模式下同样生效。
  // （浏览器原生「另存为」只认浏览器自己的下载位置，无视我们的设置。）
  showToast("开始下载：" + label);
  try {
    const r = await fetch("/api/save_download/" + uploadId + "?name=" + encodeURIComponent(name)
                          + "&course=" + encodeURIComponent(course), {
      method: "POST",
      headers: { "X-Zjucourse-Token": window.TOKEN }
    });
    const d = await r.json();
    if (d.ok) showToast("下载完成，已保存到：" + d.path, "ok", 7000);
    else showToast(d.error || "下载失败", "err", 6000);
  } catch (e) {
    showToast("下载出错：" + e, "err", 6000);

}

// ---------- 成绩查询（ETA 教务总成绩 + 分学期绩点分析） ----------
// 绩点/分数 → 颜色等级（>=4.5 或 >=90 绿，>=3.5 或 >=80 蓝，>=2.4 或 >=70 黄，其余红）
function gpaCls(v) { return v >= 4.5 ? "g-c-g" : v >= 3.5 ? "g-c-b" : v >= 2.4 ? "g-c-a" : v > 0 ? "g-c-r" : "g-c-n"; }
function dotCls(v) { return v >= 4.5 ? "dot-g" : v >= 3.5 ? "dot-b" : v >= 2.4 ? "dot-a" : v > 0 ? "dot-r" : "dot-n"; }
function scoreCls(v) {
  const n = parseFloat(v);
  if (isNaN(n)) return "g-c-n";
  return n >= 90 ? "g-c-g" : n >= 80 ? "g-c-b" : n >= 70 ? "g-c-a" : "g-c-r";
}
function fmtGpa(v) { return (v || 0).toFixed(2); }
function fmtCr(v) { return v > 0 ? (v % 1 === 0 ? v.toFixed(0) : v.toFixed(1)) : "—"; }

async function openGrades(force) {
  openMask($("#gradeModal"));
  const body = $("#gradeBody"), meta = $("#gradeMeta");

  if (GRADES) {
    renderGrades(GRADES);
    meta.textContent = "已显示本地成绩，正在同步教务系统最新数据…";
    refreshGrades(force);
    return;
  }
  meta.textContent = "正在从教务系统拉取成绩…";
  body.innerHTML = skeletonHtml("hw", 3);
  try {
    const res = await api("/api/grades" + (force ? "?force=1" : ""));

    else {
      meta.textContent = "";
      body.innerHTML = emptyBox("⚠️", (res.error || "获取失败") + "，可点右上角重新登录后再试");
    }
  } catch (e) {
    meta.textContent = "";
    body.innerHTML = emptyBox("⚠️", "获取失败：" + e);

}

// 拉取最新成绩并存入本地；弹窗开着就原地更新（不闪骨架屏）。
// 由 loadData（首载 / 点刷新 / 每 2 分钟自动）随课程数据一起触发。
async function refreshGrades(force) {
  let ok = false;
  try {
    const res = await api("/api/grades" + (force ? "?force=1" : ""));
    if (res.ok) {
      ok = true;
      GRADES = res;
      if ($("#gradeModal").style.display !== "none") renderGrades(res);
    }
  } catch (e) { /* 静默失败：不打扰课程/作业的主流程 */ }
  // 弹窗开着但同步没成功时，别让「正在同步」的提示一直挂着
  if (!ok && GRADES && $("#gradeModal").style.display !== "none") {
    $("#gradeMeta").textContent = "同步失败，当前显示的是本地缓存成绩";
  }
}
function renderGrades(data) {
  const grades = data.grades || [];
  const analysis = data.analysis || [];
  const total = data.total;
  const body = $("#gradeBody");
  if (!grades.length) {
    $("#gradeMeta").textContent = "共 0 门课程成绩";
    body.innerHTML = emptyBox("📭", "教务系统里还没有成绩记录");
    return;
  }
  $("#gradeMeta").textContent =
    `共 ${grades.length} 门课程成绩 · 数据来自 ETA 平台`;

  // 统计卡：大字五分制均绩（Celechron 口径：学分加权、剔除不计绩点课程）
  const TIER_CLS = { "g-c-g": "c-g", "g-c-b": "c-b", "g-c-a": "c-a", "g-c-r": "c-r", "g-c-n": "c-b" };
  const anaCard = (a, full, i) => {
    const tier = full ? "c-total" : TIER_CLS[gpaCls(a.gpa)] || "c-b";
    return `
    <div class="g-ana-card ${tier}" style="animation-delay:${Math.min(i * 45, 220)}ms${full ? ";flex:1 1 220px;max-width:300px" : ""}">
      <div class="ga-name">${esc(a.xn)} · ${esc(a.xq)}</div>
      <span class="ga-gpa ${gpaCls(a.gpa)}">${fmtGpa(a.gpa)}</span>
      <div class="ga-chips">
        <span class="ga-chip">GPA学分 ${fmtCr(a.credit)} · 获得 ${fmtCr(a.earnedCredit)}</span>
        <span class="ga-chip">4.3分制 ${fmtGpa(a.gpa4)} · 百分制 ${a.gpa100 ? a.gpa100.toFixed(1) : "—"}</span>
      </div>
    </div>`;
  };
  const anaHtml = (analysis.length || total)
    ? `<div class="g-ana">` + analysis.map((a, i) => anaCard(a, false, i)).join("")
      + (total ? anaCard(total, true, analysis.length) : "") + `</div>`
    : "";

  // 按「学年 · 学期」分组展示（后端已按时间倒序返回）
  const secs = [];
  for (const r of grades) {
    const key = `${r.xn} · ${r.xq}`;
    if (!secs.length || secs[secs.length - 1].key !== key) secs.push({ key, rows: [] });
    secs[secs.length - 1].rows.push(r);
  }
  const listHtml = secs.map((s, si) => `
    <div class="g-sec"><span>${esc(s.key || "未知学期")}</span><span class="g-bar"></span><span style="color:var(--muted);font-weight:400">${s.rows.length} 门</span></div>
    ` + s.rows.map((r, ri) => {
      const inc = r.gpaIncluded !== false;
      const g = parseFloat(r.grade);
      const cv = isNaN(g) ? r.grade : g;
      const gc = inc ? scoreCls(String(cv)) : "g-c-n";
      const gpa = r.gpa || 0;
      const meta = inc
        ? `绩点 ${fmtGpa(gpa)} · 学分 ${esc(fmtCr(parseFloat(r.credit)))}`
        : "不计入绩点";
      return `
      <div class="g-row ${inc ? "" : "off"}" ${inc ? "" : 'title="弃修/缓考/二级制等不计入绩点"'} style="animation-delay:${Math.min((si * 5 + ri) * 18, 240)}ms">
        <span class="g-dot ${inc ? dotCls(gpa) : "dot-n"}"></span>
        <span class="g-name" title="${esc(r.name)}">${esc(r.name)}</span>
        <span class="g-meta">${esc(meta)}</span>
        <span class="g-val ${gc}">${esc(String(cv))}</span>
      </div>`;
    }).join("")).join("");

  body.innerHTML =
    `<div class="g-tool"><button class="btn" onclick="openGrades(true)"><span class="ic" aria-hidden="true">↻</span> 刷新成绩</button></div>`
    + anaHtml + listHtml;
}

// 多文件提交作业：逐个转 base64 → 一次 /api/submit 提交（后端合成一次上交）。
// msgEl 为进度/结果提示元素；done() 在成功后回调（刷新对应视图）。
async function uploadAndSubmit(hwId, input, btn, msgEl, done) {
  const files = [...input.files];
  if (!files.length) { alert("请先选择要提交的文件（可按住 Ctrl / Shift 多选）"); return; }
  // 同一块提交区里的备注框（可选）
  const noteEl = input.closest(".submit")?.querySelector(".hw-note");
  const note = (noteEl && noteEl.value || "").trim();
  btn.disabled = true; input.disabled = true; if (noteEl) noteEl.disabled = true;
  const payload = [];
  try {
    for (let i = 0; i < files.length; i++) {
      msgEl.className = "submit-msg busy";
      msgEl.textContent = `上传中 ${i + 1}/${files.length}：${files[i].name}`;
      payload.push({ filename: files[i].name, b64: await fileToB64(files[i]) });
    }
    msgEl.className = "submit-msg busy";
    msgEl.textContent = "正在提交作业…";
    const res = await api("/api/submit", {
      method: "POST",
      body: JSON.stringify({ homework_id: hwId, files: payload, comment: note })
    });
    if (res.ok) {
      msgEl.className = "submit-msg ok";
      msgEl.textContent = `✅ 提交成功（${res.files.length} 个文件${note ? "，含备注" : ""}）：${res.files.map(esc).join("、")} · 请到「学在浙大」确认`;
      input.value = "";
      updateChips(input);
      if (noteEl) noteEl.value = "";
      done();
    } else {
      msgEl.className = "submit-msg err";
      msgEl.textContent = "❌ 提交失败：" + (res.error || "未知错误");
    }
  } catch (e) {
    msgEl.className = "submit-msg err";
    msgEl.textContent = "❌ 提交失败：" + e;
  }
  btn.disabled = false; input.disabled = false; if (noteEl) noteEl.disabled = false;
  btn.textContent = "提交作业";
}

};
$("#pwd").addEventListener("keydown", e => { if (e.key === "Enter") $("#loginBtn").click(); });

// ---- 设置浮窗 + 主题模式（light / dark / system） ----
// localStorage["zc-theme"] 存的是「模式」；html[data-theme] 始终是解析后的实际主题。
const themeMedia = matchMedia("(prefers-color-scheme: dark)");
function resolveTheme(mode) {
  return mode === "system" ? (themeMedia.matches ? "dark" : "light") : mode;
}
function applyThemeMode(mode) {
  document.documentElement.dataset.theme = resolveTheme(mode);
  try { localStorage.setItem("zc-theme", mode); } catch (e) {}
  document.querySelectorAll("#themeSeg button").forEach(b =>
    b.classList.toggle("active", b.dataset.v === mode));
}
let themeMode = "system";
try { themeMode = localStorage.getItem("zc-theme") || "system"; } catch (e) {}
if (!["light", "dark", "system"].includes(themeMode)) themeMode = "system";
applyThemeMode(themeMode);
// 跟随系统时，操作系统切换深浅色要实时生效
themeMedia.addEventListener("change", () => {
  if (themeMode === "system") applyThemeMode("system");
});

const settingsMask = $("#settingsMask");
function openSettings() {
  settingsMask.style.display = "flex";
  applyThemeMode(themeMode);
  loadDlDir();
}
function closeSettings() { settingsMask.style.display = "none"; }
$("#settingsBtn").onclick = openSettings;
$("#settingsBtnLogin").onclick = openSettings;
$("#settingsClose").onclick = closeSettings;
// 不再点遮罩关闭：设置浮窗只通过右上角 × 关闭
$("#themeSeg").addEventListener("click", e => {
  const b = e.target.closest("button[data-v]");
  if (!b) return;
  themeMode = b.dataset.v;
  applyThemeMode(themeMode);
});

// ---- 下载文件夹设置 ----
async function loadDlDir() {
  try {
    const r = await fetch("/api/download_dir", { headers: { "X-Zjucourse-Token": window.TOKEN } });
    const d = await r.json();
    if (d.ok) $("#dlDirText").textContent = d.dir || "系统默认";
  } catch (e) {}
}
$("#dlDirBtn").onclick = async () => {
  let dir = "";
  if (await ensurePv()) {
    // 桌面版：弹系统原生「选择文件夹」对话框
    dir = (await window.pywebview.api.choose_folder()) || "";
    if (!dir) return;
  } else {
    // 浏览器版：让本地服务代弹 Windows 原生「选择文件夹」窗口
    showToast("正在打开文件夹选择窗口…（若没看到，请检查任务栏）");
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 120000);
      const r = await fetch("/api/pick_dir", {
        method: "POST",
        headers: { "X-Zjucourse-Token": window.TOKEN },
        signal: ctrl.signal
      });
      clearTimeout(timer);
      const d = await r.json();
      if (d.cancelled) return;
      if (!d.ok) { showToast(d.error || "无法打开选择窗口", "err", 8000); return; }
      dir = d.dir;
    } catch (e) {
      if (e && e.name === "AbortError")
        showToast("选择窗口超时未关闭，请重试", "err", 8000);
      else
        showToast("打开选择窗口出错：" + e + "（若刚重启过服务，请刷新页面再试）", "err", 10000);
      return;
    }
  }
  try {
    const r = await fetch("/api/download_dir", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Zjucourse-Token": window.TOKEN },
      body: JSON.stringify({ dir })
    });
    const d = await r.json();
    if (!d.ok) alert(d.error || "设置失败");
    $("#dlDirText").textContent = d.dir || "";
  } catch (e) {
    alert("设置出错：" + e);
  }
};

$("#dlDirOpen").onclick = async () => {
  try {
    const r = await fetch("/api/open_download_dir", {
      method: "POST",
      headers: { "X-Zjucourse-Token": window.TOKEN }
    });
    const d = await r.json();
    if (!d.ok) showToast(d.error || "无法打开文件夹", "err", 6000);
  } catch (e) {
    showToast("打开文件夹出错：" + e, "err", 6000);
  }
};

// ---- 截止前提醒设置 ----
function syncRemindUI() {
  $("#remindOn").checked = remindCfg.on;
  document.querySelectorAll("#remindSeg button").forEach(b =>
    b.classList.toggle("active", +b.dataset.v === remindCfg.hours));
  const row = $("#remindHoursRow");
  row.style.opacity = remindCfg.on ? "" : ".45";
  row.style.pointerEvents = remindCfg.on ? "" : "none";
}
function onRemindChanged() {
  saveRemindCfg();
  syncRemindUI();
  renderHomeworks();          // 首页列表立即重刷
  if (typeof renderHomeworkBox === "function" &&
      $("#detail").style.display !== "none") renderHomeworkBox();
}
$("#remindOn").onchange = e => { remindCfg.on = e.target.checked; onRemindChanged(); };
$("#remindSeg").addEventListener("click", e => {
  const b = e.target.closest("button[data-v]");
  if (!b) return;
  remindCfg.hours = +b.dataset.v;
  onRemindChanged();
});
syncRemindUI();

$("#refreshBtn").onclick = () => loadData(true);
$("#semesterSel").onchange = () => { renderCourses(); renderHomeworks(); };
$("#hwFilter").onchange = renderHomeworks;
$("#courseSearch").oninput = renderCourses;
$("#logoutBtn").onclick = async () => {
  await api("/api/logout", { method: "POST" });
  DATA = { courses: [], homeworks: [], activeIds: new Set() };
  $("#app").style.display = "none";
  $("#login").style.display = "flex";
};
// 每两分钟静默刷新一次（刷新会更新倒计时和提交状态）
setInterval(() => { if ($("#app").style.display === "flex") loadData(); }, 120000);
</script>
